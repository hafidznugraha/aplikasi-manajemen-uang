<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atur Ulang Kata Sandi - BudgetKu</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="public/css/style.css" rel="stylesheet">
</head>
<body class="auth-page bg-light d-flex align-items-center justify-content-center min-vh-100 p-3" style="font-family: 'Inter', sans-serif;">

  <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white w-100" style="max-width: 440px;">
      
      <!-- Brand Header -->
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 56px; height: 56px;">
          <i class="bi bi-shield-lock-fill fs-3"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">Kata Sandi Baru</h3>
        <p class="text-muted small mb-0">Silakan masukkan kata sandi baru untuk akun Anda.</p>
      </div>

      <!-- Reset Password Form -->
      <form id="reset-password-form" onsubmit="return handleResetPasswordSubmit(event);">
        <!-- Kata Sandi Baru -->
        <div class="mb-3">
          <label for="reset-new-password" class="form-label fw-medium text-dark small">Kata Sandi Baru</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control border-start-0 ps-0" id="reset-new-password" placeholder="Minimal 6 karakter" required minlength="6" autocomplete="new-password">
          </div>
        </div>

        <!-- Konfirmasi Kata Sandi Baru -->
        <div class="mb-4">
          <label for="reset-confirm-password" class="form-label fw-medium text-dark small">Konfirmasi Kata Sandi</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-shield-check"></i></span>
            <input type="password" class="form-control border-start-0 ps-0" id="reset-confirm-password" placeholder="Ulangi kata sandi baru" required minlength="6" autocomplete="new-password">
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btn-reset-password" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm d-flex align-items-center justify-content-center gap-2">
          <i class="bi bi-check2-circle"></i> Simpan Kata Sandi
        </button>
      </form>

      <!-- Back to Login Link -->
      <div class="text-center mt-4 pt-2 border-top">
        <p class="text-muted small mb-0">
          Sudah ingat kata sandi? <a href="login.html" class="text-primary fw-semibold text-decoration-none">Kembali ke Login</a>
        </p>
      </div>

    </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Modal Alert & Supabase JS SDK -->
  <script src="public/js/modal-alert.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Supabase Connection & Reset Password JS -->
  <script src="public/js/supabase.js"></script>
  <script src="public/js/reset-password.js"></script>
</body>
</html>
