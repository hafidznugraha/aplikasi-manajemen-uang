<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun - BudgetKu</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="public/css/style.css" rel="stylesheet">
  <script>
    (function() {
      const saved = localStorage.getItem('budgetku_theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    })();
  </script>
  <style>
    .otp-digit {
      flex: 1 1 0;
      min-width: 0;
      max-width: 44px;
      height: 52px;
      border-radius: 10px;
      font-size: 1.25rem;
      font-weight: 700;
      text-align: center;
      padding: 0;
      background-color: var(--bk-card-bg);
      border: 1px solid var(--bk-border);
      color: var(--bk-text);
      transition: border-color var(--bk-spring-fast), box-shadow var(--bk-spring-fast);
    }
    .otp-digit:focus {
      border-color: var(--bk-primary);
      box-shadow: 0 0 0 3px var(--bk-primary-glow);
    }
  </style>
</head>
<body class="auth-page d-flex align-items-center justify-content-center min-vh-100 p-3">

  <div class="card card-budgetku p-4 p-md-5 w-100" style="max-width: 480px;">
      
      <!-- STEP 1: Form Pendaftaran -->
      <div id="register-step-1">
        <!-- Brand Header -->
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center rounded-4 mb-3" style="width: 58px; height: 58px; background: linear-gradient(135deg, var(--bk-primary), #004fb0); color: #ffffff; box-shadow: 0 4px 16px var(--bk-primary-glow);">
            <i class="bi bi-wallet2 fs-3"></i>
          </div>
          <h3 class="fw-bold mb-1">BudgetKu</h3>
          <p class="text-secondary small mb-0">Buat akun baru untuk mulai mencatat keuangan</p>
        </div>

        <!-- Register Form -->
        <form id="register-form" onsubmit="return handleRegisterSubmit(event);">
          <!-- Full Name Input -->
          <div class="mb-3">
            <label for="register-name" class="form-label fw-medium small">Nama Lengkap</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="register-name" placeholder="John Doe" required autocomplete="name">
            </div>
          </div>

          <!-- Email Input -->
          <div class="mb-3">
            <label for="register-email" class="form-label fw-medium small">Alamat Email</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="register-email" placeholder="nama@email.com" required autocomplete="email">
            </div>
          </div>

          <!-- Password Input -->
          <div class="mb-3">
            <label for="register-password" class="form-label fw-medium small">Kata Sandi</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="register-password" placeholder="Minimal 6 karakter" required minlength="6" autocomplete="new-password">
            </div>
          </div>

          <!-- Password Confirmation Input -->
          <div class="mb-4">
            <label for="register-password-confirm" class="form-label fw-medium small">Konfirmasi Kata Sandi</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
              <input type="password" class="form-control" id="register-password-confirm" placeholder="Ulangi kata sandi" required minlength="6" autocomplete="new-password">
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2">
            <i class="bi bi-envelope-arrow-up"></i> Daftar & Dapatkan OTP
          </button>
        </form>

        <!-- Login Link -->
        <div class="text-center mt-4 pt-3 border-top" style="border-color: var(--bk-border);">
          <p class="text-secondary small mb-0">
            Sudah punya akun? <a href="login.html" class="text-primary fw-semibold text-decoration-none">Masuk di sini</a>
          </p>
        </div>
      </div>

      <!-- STEP 2: Verifikasi Kode OTP -->
      <div id="register-step-2" class="d-none">
        <!-- OTP Header -->
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center rounded-4 mb-3" style="width: 58px; height: 58px; background-color: var(--bk-primary-light); color: var(--bk-primary);">
            <i class="bi bi-shield-lock-fill fs-3"></i>
          </div>
          <h4 class="fw-bold mb-1">Verifikasi Email</h4>
          <p class="text-secondary small mb-2">Kami telah mengirimkan 8 digit kode OTP ke:</p>
          <div class="badge border px-3 py-2 fs-6 fw-semibold text-truncate d-inline-block mw-100 rounded-pill" id="otp-target-email-badge" style="background-color: var(--bk-card-secondary-bg); color: var(--bk-text);">
            email@domain.com
          </div>
        </div>

        <!-- Form OTP -->
        <form id="otp-verify-form" onsubmit="return handleOtpVerifySubmit(event);">
          <div class="mb-4">
            <label class="form-label fw-medium small text-center w-100">Masukkan 8 Digit Kode OTP</label>
            <div class="d-flex justify-content-between gap-1 gap-sm-2 mb-4" id="otp-inputs-container">
              <input type="text" class="form-control otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" required data-index="0">
              <input type="text" class="form-control otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" required data-index="1">
              <input type="text" class="form-control otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" required data-index="2">
              <input type="text" class="form-control otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" required data-index="3">
              <input type="text" class="form-control otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" required data-index="4">
              <input type="text" class="form-control otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" required data-index="5">
              <input type="text" class="form-control otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" required data-index="6">
              <input type="text" class="form-control otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" required data-index="7">
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="btn-verify-otp" class="btn btn-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2">
            <i class="bi bi-check2-circle"></i> Verifikasi & Buat Akun
          </button>
        </form>

        <!-- Resend OTP & Timer -->
        <div class="text-center mt-3">
          <span id="otp-timer-text" class="text-secondary small">
            Kirim ulang kode dalam <strong id="otp-timer-count" class="text-primary font-monospace">00:59</strong>
          </span>
          <button type="button" id="btn-resend-otp" class="btn btn-link p-0 text-primary text-decoration-none fw-semibold small d-none" onclick="handleResendOtp()">
            <i class="bi bi-arrow-clockwise me-1"></i> Kirim Ulang Kode OTP
          </button>
        </div>

        <!-- Back to Step 1 Button -->
        <div class="text-center mt-4 pt-3 border-top" style="border-color: var(--bk-border);">
          <button type="button" class="btn btn-link text-secondary p-0 text-decoration-none small" onclick="goToStep1()">
            <i class="bi bi-arrow-left me-1"></i> Ubah Data / Kembali
          </button>
        </div>
      </div>

    </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Modal Alert & Supabase JS SDK -->
  <script src="public/js/modal-alert.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Supabase Connection & Auth JS -->
  <script src="public/js/supabase.js"></script>
  <script src="public/js/auth.js"></script>
  <script src="public/js/register.js"></script>
</body>
</html>
