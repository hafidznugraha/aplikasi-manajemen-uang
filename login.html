<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - BudgetKu</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="public/css/style.css" rel="stylesheet">
</head>
<body class="auth-page bg-light d-flex align-items-center justify-content-center min-vh-100 p-3" style="font-family: 'Inter', sans-serif;">

  <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white w-100" style="max-width: 420px;">
      
      <!-- Brand Header -->
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 56px; height: 56px;">
          <i class="bi bi-wallet2 fs-3"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">BudgetKu</h3>
        <p class="text-muted small mb-0">Masuk ke akun Anda untuk mengelola keuangan</p>
      </div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="return handleLoginSubmit(event);">
        <!-- Email Input -->
        <div class="mb-3">
          <label for="login-email" class="form-label fw-medium text-dark small">Alamat Email</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control border-start-0 ps-0" id="login-email" placeholder="nama@email.com" required autocomplete="email">
          </div>
        </div>

        <!-- Password Input -->
        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="login-password" class="form-label fw-medium text-dark small mb-0">Kata Sandi</label>
            <a href="forgot-password.html" class="text-primary small text-decoration-none fw-medium">Lupa sandi?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control border-start-0 ps-0" id="login-password" placeholder="••••••••" required autocomplete="current-password">
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="mb-4 form-check">
          <input type="checkbox" class="form-check-input" id="remember-me">
          <label class="form-check-label text-muted small" for="remember-me">Ingat saya di perangkat ini</label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm d-flex align-items-center justify-content-center gap-2">
          <i class="bi bi-box-arrow-in-right"></i> Masuk
        </button>
      </form>

      <!-- Register Link -->
      <div class="text-center mt-4 pt-2 border-top">
        <p class="text-muted small mb-0">
          Belum punya akun? <a href="register.html" class="text-primary fw-semibold text-decoration-none">Daftar sekarang</a>
        </p>
      </div>

    </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Modal Alert & Supabase JS SDK -->
  <script src="public/js/modal-alert.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Supabase Connection & Auth JS -->
  <script src="public/js/supabase.js"></script>
  <script src="public/js/auth.js"></script>
  <script src="public/js/login.js"></script>
</body>
</html>
