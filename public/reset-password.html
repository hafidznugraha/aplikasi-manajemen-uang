<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atur Ulang Kata Sandi - BudgetKu</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet">
  <script>
    (function() {
      const saved = localStorage.getItem('budgetku_theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    })();
  </script>
</head>
<body class="auth-page d-flex align-items-center justify-content-center min-vh-100 p-3">

  <div class="card card-budgetku p-4 p-md-5 w-100" style="max-width: 440px;">
      <!-- Brand Header -->
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center rounded-4 mb-3" style="width: 58px; height: 58px; background-color: var(--bk-primary-light); color: var(--bk-primary);">
          <i class="bi bi-shield-lock-fill fs-3"></i>
        </div>
        <h3 class="fw-bold mb-1">Kata Sandi Baru</h3>
        <p class="text-secondary small mb-0">Silakan masukkan kata sandi baru untuk akun Anda.</p>
      </div>

      <!-- Reset Password Form -->
      <form id="reset-password-form" onsubmit="return handleResetPasswordSubmit(event);">
        <!-- Kata Sandi Baru -->
        <div class="mb-3">
          <label for="reset-new-password" class="form-label fw-medium small">Kata Sandi Baru</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="reset-new-password" placeholder="Minimal 6 karakter" required minlength="6" autocomplete="new-password">
          </div>
        </div>

        <!-- Konfirmasi Kata Sandi Baru -->
        <div class="mb-4">
          <label for="reset-confirm-password" class="form-label fw-medium small">Konfirmasi Kata Sandi</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
            <input type="password" class="form-control" id="reset-confirm-password" placeholder="Ulangi kata sandi baru" required minlength="6" autocomplete="new-password">
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btn-reset-password" class="btn btn-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2">
          <i class="bi bi-check2-circle"></i> Simpan Kata Sandi
        </button>
      </form>

      <!-- Back to Login Link -->
      <div class="text-center mt-4 pt-3 border-top" style="border-color: var(--bk-border);">
        <p class="text-secondary small mb-0">
          Sudah ingat kata sandi? <a href="login.html" class="text-primary fw-semibold text-decoration-none">Kembali ke Login</a>
        </p>
      </div>

    </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Modal Alert & Supabase JS SDK -->
  <script src="js/modal-alert.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Supabase Connection & Reset Password JS -->
  <script src="js/supabase.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
