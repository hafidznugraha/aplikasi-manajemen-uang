<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Kata Sandi - BudgetKu</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="auth-page bg-light d-flex align-items-center justify-content-center min-vh-100 p-3" style="font-family: 'Inter', sans-serif;">

  <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white w-100" style="max-width: 440px;">
      
      <!-- Brand Header -->
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 56px; height: 56px;">
          <i class="bi bi-key-fill fs-3"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">Lupa Kata Sandi?</h3>
        <p class="text-muted small mb-0">Masukkan alamat email yang terdaftar untuk menerima tautan pemulihan kata sandi.</p>
      </div>

      <!-- Forgot Password Form -->
      <form id="forgot-password-form" onsubmit="return handleForgotPasswordSubmit(event);">
        <!-- Email Input -->
        <div class="mb-4">
          <label for="forgot-email" class="form-label fw-medium text-dark small">Alamat Email</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control border-start-0 ps-0" id="forgot-email" placeholder="nama@email.com" required autocomplete="email">
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btn-forgot-password" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm d-flex align-items-center justify-content-center gap-2">
          <i class="bi bi-send-fill"></i> Kirim Link Reset
        </button>
      </form>

      <!-- Back to Login Link -->
      <div class="text-center mt-4 pt-2 border-top">
        <p class="text-muted small mb-0">
          Ingat kata sandi Anda? <a href="login.html" class="text-primary fw-semibold text-decoration-none">Kembali ke Login</a>
        </p>
      </div>

    </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Modal Alert & Supabase JS SDK -->
  <script src="js/modal-alert.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Supabase Connection & Forgot Password JS -->
  <script src="js/supabase.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
